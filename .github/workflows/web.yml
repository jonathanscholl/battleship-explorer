name: Validate and build web preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and export templates
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -joq templates.tpz 'templates/web_*.zip' -d ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test core gameplay
        run: |
          timeout 60s godot --headless --path . --script res://tests/test_core.gd
          timeout 60s godot --headless --path . --script res://tests/test_ui.gd
          timeout 60s godot --headless --path . --script res://tests/test_battle.gd
          timeout 60s godot --headless --path . --script res://tests/test_economy.gd
          timeout 60s godot --headless --path . --script res://tests/test_levels.gd
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: battleship-explorer-web
          path: build/web/
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
